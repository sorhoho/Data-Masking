events {
  worker_connections 1024;
}

http {
  upstream opa_cluster {
    least_conn;
    server opa-1:8181;
    server opa-2:8181;
    server opa-3:8181;
  }

  server {
    listen 8181;

    # Policy decision endpoint — proxied to OPA cluster
    location / {
      proxy_pass            http://opa_cluster;
      proxy_read_timeout    10s;
      proxy_connect_timeout 5s;
      proxy_send_timeout    10s;

      # Fail-closed: on upstream error try next replica; never silently open
      proxy_next_upstream   error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }

    # LB health endpoint (does not check individual OPA replicas)
    location /health {
      access_log off;
      return 200 '{"status":"ok","mode":"ha"}';
      add_header Content-Type application/json;
    }
  }
}
