# OPA runtime configuration
# - Bundle mode: OPA polls bundle server for masking_config instead of
#   relying on in-memory data API (which would be lost on restart).
# - BUNDLE_SERVICE_URL env var: defaults to http://admin-service:8888.
#   Override to point at a remote admin-service when running centralized.
# - Decision logging: every policy evaluation emitted to stdout as
#   structured JSON, captured by Docker and queryable via Loki/Grafana.

services:
  bundle_server:
    url: ${BUNDLE_SERVICE_URL}

bundles:
  masking_config:
    resource: "/bundle/masking_config.tar.gz"
    service: bundle_server
    polling:
      min_delay_seconds: 15
      max_delay_seconds: 60

decision_logs:
  console: true
