# Loki 3.x single-binary — filesystem/TSDB, no auth.
# query_range cache and ruler sections omitted; they are not needed for
# this demo and can cause startup hangs in some 3.x patch releases.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false

analytics:
  reporting_enabled: false
