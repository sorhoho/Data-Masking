<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Governance – Data Masking{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { letter-spacing: .03em; }
    .nav-link.active { font-weight: 600; }
    .table th { white-space: nowrap; }
    .badge-pending  { background: #fd7e14; }
    .badge-approved { background: #198754; }
    .badge-rejected { background: #dc3545; }
    .badge-active   { background: #0d6efd; }
    .badge-completed{ background: #6c757d; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">&#128101; Identity Governance</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/requests' in request.path %}active{% endif %}" href="/requests">&#128196; Role Requests</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/users' in request.path %}active{% endif %}" href="/users">&#128100; Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/reviews' in request.path %}active{% endif %}" href="/reviews">&#128270; Access Reviews</a>
        </li>
      </ul>
      <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width: 1200px">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
