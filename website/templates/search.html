{% extends "base.html" %}
{% block title %}Search – CRM Portal{% endblock %}

{% block content %}
<h2 class="mb-4">Customer Search</h2>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <form method="get" action="" onsubmit="go(event)">
      <div class="input-group">
        <input id="cid" type="text" class="form-control form-control-lg"
               placeholder="Enter Customer ID (e.g. C001, C002, C003, C004)"
               autofocus />
        <button class="btn btn-primary btn-lg" type="submit">Look Up</button>
      </div>
    </form>
  </div>
</div>

<h5 class="text-muted">Available test customers</h5>
<div class="row row-cols-1 row-cols-md-4 g-3">
  {% for cid in ['C001', 'C002', 'C003', 'C004'] %}
  <div class="col">
    <a href="/customer/{{ cid }}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-0 bg-light">
        <div class="card-body text-center py-4">
          <div class="fs-1">&#128100;</div>
          <div class="fw-bold">{{ cid }}</div>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>

<script>
function go(e) {
    e.preventDefault();
    const id = document.getElementById('cid').value.trim();
    if (id) window.location = '/customer/' + encodeURIComponent(id);
}
</script>
{% endblock %}
