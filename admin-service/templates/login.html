<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login – Data Masking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow-lg" style="width: 360px">
  <div class="card-header bg-dark text-white text-center py-3">
    <div class="fs-2">&#128737;</div>
    <div class="fw-bold">Data Masking Admin</div>
    <small class="text-muted">Policy &amp; Configuration Console</small>
  </div>
  <div class="card-body p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="username">Username</label>
        <input id="username" name="username" type="text" class="form-control"
               autofocus autocomplete="username" required />
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               autocomplete="current-password" required />
      </div>
      <button class="btn btn-dark w-100" type="submit">Sign in</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
