version: "3.8"

services:

  # ── PostgreSQL (shared by Keycloak, admin-service, midPoint) ─────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/init-midpoint-schema.sh:/docker-entrypoint-initdb.d/z-init-midpoint-schema.sh
      - ./postgres/midpoint-schema.sql:/midpoint-sql/postgres.sql
      - ./postgres/midpoint-quartz.sql:/midpoint-sql/postgres-quartz.sql
      - ./postgres/midpoint-audit.sql:/midpoint-sql/postgres-audit.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Identity Provider ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Policy Engine (Open Policy Agent) ────────────────────────────────────
  opa:
    build: ./opa
    ports:
      - "8181:8181"
    depends_on:
      - admin-service

  # ── Mock CRM Backend ──────────────────────────────────────────────────────
  crm-mock:
    build: ./crm-mock

  # ── Mock Billing Backend ──────────────────────────────────────────────────
  billing-mock:
    build: ./billing-mock

  # ── Admin GUI — data masking policy + unmask approval ────────────────────
  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports:
      - "8888:8888"
    environment:
      OPA_URL: "http://opa:8181"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      DATABASE_URL: "postgresql://adminuser:admin_pass@postgres:5432/admindb"
      SECRET_KEY: "admin-secret-change-in-production"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      GOVERNANCE_API_KEY: "governance-internal-key"
      MIDPOINT_URL: "http://midpoint:8080"
      MIDPOINT_ADMIN_USER: "administrator"
      MIDPOINT_ADMIN_PASS: "5ecr3t"
    depends_on:
      postgres:
        condition: service_healthy
      midpoint:
        condition: service_started

  # ── Identity Governance (midPoint IGA) ───────────────────────────────────
  midpoint:
    image: evolveum/midpoint:4.9-alpine
    ports:
      - "8090:8080"
    environment:
      MP_SET_midpoint_administrator_initialPassword: "Admin123!"
      # Override image's built-in H2 defaults with PostgreSQL/native settings
      MP_SET_midpoint_repository_type: "native"
      MP_SET_midpoint_repository_database: "postgresql"
      MP_SET_midpoint_repository_jdbcUrl: "jdbc:postgresql://postgres:5432/midpoint"
      MP_SET_midpoint_repository_jdbcUsername: "midpoint"
      MP_SET_midpoint_repository_jdbcPassword: "midpoint_pass"
    volumes:
      - midpoint-home:/opt/midpoint/var
      # config.xml mounted at correct path: ${midpoint.home}/config.xml = /opt/midpoint/var/config.xml
      - ./midpoint/config/config.xml:/opt/midpoint/var/config.xml
      - ./midpoint/post-initial-objects:/opt/midpoint/var/post-initial-objects
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── API Gateway (Kong) ────────────────────────────────────────────────────
  kong:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_UNTRUSTED_LUA: "on"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      GOVERNANCE_INTERNAL_URL: "http://admin-service:8888"
    volumes:
      - ./kong:/kong
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - crm-mock
      - billing-mock
      - opa
      - admin-service
    restart: on-failure

  # ── Frontend Hub (portal + per-app OIDC frontends) ───────────────────────
  frontend-hub:
    build: ./frontend-hub
    ports:
      - "3001:3001"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      OPA_URL: "http://opa:8181"
      GOVERNANCE_INTERNAL_URL: "http://admin-service:8888"
      GOVERNANCE_API_KEY: "governance-internal-key"
      SECRET_KEY: "hub-secret-change-in-production"
    depends_on:
      - kong
      - keycloak
    restart: on-failure

  # ── Customer-Agent Website ────────────────────────────────────────────────
  website:
    build: ./website
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      SECRET_KEY: "demo-secret-change-in-production"
    depends_on:
      - kong
      - keycloak
    restart: on-failure

  # ── Kafka-compatible broker (Redpanda) ───────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v23.3.21
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  # ── Kafka masking service ────────────────────────────────────────────────────
  kafka-masker:
    build:
      context: .
      dockerfile: kafka-masker/Dockerfile
    environment:
      KAFKA_BROKER: redpanda:9092
      OPA_URL: http://opa:8181
      RAW_TOPIC: raw.customer.events
      DLQ_TOPIC: dlq.masking.errors
      CONSUMER_GROUP: masking-group
    depends_on:
      redpanda:
        condition: service_healthy
      opa:
        condition: service_started
    restart: on-failure

  # ── MinIO (S3-compatible data lake storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── DW / Lake / Mart masking service ────────────────────────────────────────
  dw-masker:
    build:
      context: .
      dockerfile: dw-masker/Dockerfile
    ports:
      - "5003:5003"
    environment:
      OPA_URL: http://opa:8181
      DB_URL: postgresql://adminuser:admin_pass@postgres:5432/admindb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: masked-exports
      ADMIN_SERVICE_URL: http://admin-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      opa:
        condition: service_started
    restart: on-failure

networks:
  default:
    name: data-masking-network

volumes:
  postgres-data:
  midpoint-home:
  minio-data:
