version: "3.8"

services:

  # ── Identity Provider ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    # No healthcheck — realm import takes 2-3 min; website handles Keycloak
    # not-yet-ready via authlib retry and the login redirect loop.

  # ── Policy Engine (Open Policy Agent) ────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest
    command: run --server --log-level info --v0-compatible /policies/policy.rego
    volumes:
      - ./opa:/policies
    ports:
      - "8181:8181"

  # ── Log Dashboard ─────────────────────────────────────────────────────────
  log-dashboard:
    build: ./log-dashboard
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Mock CRM Backend ──────────────────────────────────────────────────────
  crm-mock:
    build: ./crm-mock
    environment:
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    depends_on:
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Admin GUI (policy + VIP configuration) ───────────────────────────────
  admin-service:
    build: ./admin-service
    ports:
      - "8888:8888"
    environment:
      OPA_URL: "http://opa:8181"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      DB_PATH: "/data/admin.db"
      SECRET_KEY: "admin-secret-change-in-production"
      LOG_DASHBOARD_URL: "http://log-dashboard:9000/log"
    volumes:
      - admin-data:/data
    depends_on:
      opa:
        condition: service_started
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ── Mock Billing Backend ──────────────────────────────────────────────────
  billing-mock:
    build: ./billing-mock
    environment:
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    depends_on:
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── API Gateway (Kong) ────────────────────────────────────────────────────
  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_UNTRUSTED_LUA: "on"
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    volumes:
      - ./kong:/kong
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      crm-mock:
        condition: service_healthy
      billing-mock:
        condition: service_healthy
      opa:
        condition: service_started
      log-dashboard:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    # No healthcheck — Kong starts reliably once dependencies are up;
    # the status endpoint is available immediately after process start.
    restart: on-failure

  # ── Customer-Agent Website ────────────────────────────────────────────────
  website:
    build: ./website
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      LOG_DASHBOARD_URL: "http://log-dashboard:9000/log"
      SECRET_KEY: "demo-secret-change-in-production"
    depends_on:
      kong:
        condition: service_started
      keycloak:
        condition: service_started
      log-dashboard:
        condition: service_healthy
    restart: on-failure

networks:
  default:
    name: data-masking-network

volumes:
  admin-data:
