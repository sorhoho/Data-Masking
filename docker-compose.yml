version: "3.8"

services:

  # ── PostgreSQL (shared by Keycloak and admin-service) ────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Identity Provider ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # No healthcheck — realm import takes 2-3 min; website handles Keycloak
    # not-yet-ready via authlib retry and the login redirect loop.

  # ── Policy Engine (Open Policy Agent) ────────────────────────────────────
  opa:
    build: ./opa
    ports:
      - "8181:8181"
    depends_on:
      admin-service:
        condition: service_healthy

  # ── Log Dashboard ─────────────────────────────────────────────────────────
  log-dashboard:
    build: ./log-dashboard
    ports:
      - "9000:9000"
    environment:
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Loki (log persistence) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.1
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
      - ./grafana/loki-config.yaml:/etc/loki/loki-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Grafana (log query + dashboards) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      loki:
        condition: service_healthy

  # ── Mock CRM Backend ──────────────────────────────────────────────────────
  crm-mock:
    build: ./crm-mock
    environment:
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    depends_on:
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Mock Billing Backend ──────────────────────────────────────────────────
  billing-mock:
    build: ./billing-mock
    environment:
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    depends_on:
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Admin GUI (policy + VIP configuration) ───────────────────────────────
  admin-service:
    build: ./admin-service
    ports:
      - "8888:8888"
    environment:
      OPA_URL: "http://opa:8181"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      DATABASE_URL: "postgresql://adminuser:admin_pass@postgres:5432/admindb"
      SECRET_KEY: "admin-secret-change-in-production"
      LOG_DASHBOARD_URL: "http://log-dashboard:9000/log"
    depends_on:
      postgres:
        condition: service_healthy
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ── API Gateway (Kong) ────────────────────────────────────────────────────
  kong:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_UNTRUSTED_LUA: "on"
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      # KEYCLOAK_ISSUER: unset — Kong accepts any iss whose realm path matches
      # KEYCLOAK_REALM. Set this to the exact issuer URL to enforce strict
      # validation (recommended in production, required when Keycloak sits behind
      # a reverse proxy with a fixed hostname).
    volumes:
      - ./kong:/kong
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      crm-mock:
        condition: service_healthy
      billing-mock:
        condition: service_healthy
      opa:
        condition: service_started
      log-dashboard:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    # No healthcheck — Kong starts reliably once dependencies are up.
    restart: on-failure

  # ── Customer-Agent Website ────────────────────────────────────────────────
  website:
    build: ./website
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      LOG_DASHBOARD_URL: "http://log-dashboard:9000/log"
      SECRET_KEY: "demo-secret-change-in-production"
    depends_on:
      kong:
        condition: service_started
      keycloak:
        condition: service_started
      log-dashboard:
        condition: service_healthy
    restart: on-failure

networks:
  default:
    name: data-masking-network

volumes:
  postgres-data:
  loki-data:
  grafana-data:
