version: "3.8"

services:

  # ── PostgreSQL (shared by Keycloak and admin-service) ────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Identity Provider ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ── Policy Engine (Open Policy Agent) ────────────────────────────────────
  # Dev: single replica. For HA/centralized: docker-compose.ha.yml override.
  opa:
    build: ./opa
    ports:
      - "8181:8181"
    environment:
      BUNDLE_SERVICE_URL: "http://admin-service:8888"
    depends_on:
      - admin-service

  # ── Mock CRM Backend ──────────────────────────────────────────────────────
  crm-mock:
    build: ./crm-mock

  # ── Mock Billing Backend ──────────────────────────────────────────────────
  billing-mock:
    build: ./billing-mock

  # ── Admin GUI (policy + VIP configuration) ───────────────────────────────
  admin-service:
    build: ./admin-service
    ports:
      - "8888:8888"
    environment:
      OPA_URL: "http://opa:8181"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      DATABASE_URL: "postgresql://adminuser:admin_pass@postgres:5432/admindb"
      SECRET_KEY: "admin-secret-change-in-production"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    depends_on:
      - postgres

  # ── Identity Governance ───────────────────────────────────────────────────
  governance-service:
    build: ./governance-service
    ports:
      - "8889:8889"
    environment:
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      DATABASE_URL: "postgresql://adminuser:admin_pass@postgres:5432/admindb"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      SECRET_KEY: "governance-secret-change-in-production"
      GOVERNANCE_API_KEY: "governance-internal-key"
    depends_on:
      - postgres
      - keycloak
    restart: on-failure

  # ── API Gateway (Kong) ────────────────────────────────────────────────────
  kong:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_UNTRUSTED_LUA: "on"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      GOVERNANCE_INTERNAL_URL: "http://governance-service:8889"
    volumes:
      - ./kong:/kong
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - crm-mock
      - billing-mock
      - opa
      - admin-service
      - governance-service
    restart: on-failure

  # ── Frontend Hub (portal + per-app OIDC frontends) ───────────────────────
  frontend-hub:
    build: ./frontend-hub
    ports:
      - "3001:3001"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      OPA_URL: "http://opa:8181"
      GOVERNANCE_INTERNAL_URL: "http://governance-service:8889"
      GOVERNANCE_API_KEY: "governance-internal-key"
      SECRET_KEY: "hub-secret-change-in-production"
    depends_on:
      - kong
      - keycloak
    restart: on-failure

  # ── Customer-Agent Website ────────────────────────────────────────────────
  website:
    build: ./website
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      SECRET_KEY: "demo-secret-change-in-production"
    depends_on:
      - kong
      - keycloak
    restart: on-failure

networks:
  default:
    name: data-masking-network

volumes:
  postgres-data:
