version: "3.8"

services:

  # ── Identity Provider ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── Policy Engine (Open Policy Agent) ────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest
    command: run --server --log-level info --v0-compatible /policies/policy.rego
    volumes:
      - ./opa:/policies
    ports:
      - "8181:8181"

  # ── Log Dashboard ─────────────────────────────────────────────────────────
  log-dashboard:
    build: ./log-dashboard
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Mock CRM Backend ──────────────────────────────────────────────────────
  crm-mock:
    build: ./crm-mock
    environment:
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    depends_on:
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── API Gateway (Kong) ────────────────────────────────────────────────────
  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_UNTRUSTED_LUA: "on"
      LOG_DASHBOARD_URL: http://log-dashboard:9000/log
    volumes:
      - ./kong:/kong
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      crm-mock:
        condition: service_healthy
      opa:
        condition: service_started
      log-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Customer-Agent Website ────────────────────────────────────────────────
  website:
    build: ./website
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      KEYCLOAK_URL: "http://localhost:8080"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KONG_URL: "http://kong:8000"
      LOG_DASHBOARD_URL: "http://log-dashboard:9000/log"
      SECRET_KEY: "demo-secret-change-in-production"
    depends_on:
      kong:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      log-dashboard:
        condition: service_healthy

networks:
  default:
    name: data-masking-network
