_format_version: "3.0"
_transform: true

# ── Upstream CRM service ──────────────────────────────────────────────────────
services:
  - name: crm-service
    url: http://crm-mock:5000
    connect_timeout: 10000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: crm-customer-route
        paths:
          - /api/customer
        methods:
          - GET
        strip_path: false
      - name: crm-unmask-route
        paths:
          - /api/unmask
        methods:
          - GET
        strip_path: false

# ── Plugins (applied to the crm-service) ─────────────────────────────────────
plugins:

  # CORS – allow the website frontend to call Kong directly if needed
  - name: cors
    service: crm-service
    config:
      origins:
        - "*"
      methods:
        - GET
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
      credentials: true
      max_age: 3600

  # ── Step 1: JWT introspection + OPA policy check ──────────────────────────
  - name: pre-function
    service: crm-service
    config:
      access:
        - |
          local http  = require("resty.http")
          local cjson = require("cjson.safe")

          local keycloak_host = os.getenv("KEYCLOAK_HOST") or ""
          local KEYCLOAK_INTROSPECT
          if keycloak_host ~= "" then
              KEYCLOAK_INTROSPECT = "https://" .. keycloak_host
                  .. "/realms/demo/protocol/openid-connect/token/introspect"
          else
              KEYCLOAK_INTROSPECT = os.getenv("KEYCLOAK_INTROSPECT_URL")
                  or "http://keycloak:8080/realms/demo/protocol/openid-connect/token/introspect"
          end

          local KONG_CLIENT_ID     = "kong-client"
          local KONG_CLIENT_SECRET = "kong-secret-456"
          local OPA_URL  = os.getenv("OPA_URL") or "http://opa:8181/v1/data/data_masking"
          local ROLE_PRIORITY = { admin = 3, supervisor = 2, agent = 1 }

          kong.ctx.shared.token_active = false
          kong.ctx.shared.opa_allowed  = false
          kong.ctx.shared.deny_reason  = nil

          local function json_exit(status, msg)
              return kong.response.exit(status, { error = true, message = msg },
                  { ["Content-Type"] = "application/json" })
          end

          local auth_header = kong.request.get_header("Authorization")
          if not auth_header then
              kong.ctx.shared.deny_reason = "missing_token"
              return json_exit(401, "Missing Authorization header")
          end

          local token = auth_header:match("^[Bb]earer%s+(.+)$")
          if not token then
              kong.ctx.shared.deny_reason = "malformed_header"
              return json_exit(401, "Invalid Authorization header format")
          end

          local httpc = http.new()
          httpc:set_timeout(8000)

          local res, err = httpc:request_uri(KEYCLOAK_INTROSPECT, {
              method   = "POST",
              headers  = { ["Content-Type"] = "application/x-www-form-urlencoded" },
              body     = "token=" .. token
                      .. "&client_id=" .. KONG_CLIENT_ID
                      .. "&client_secret=" .. KONG_CLIENT_SECRET,
              ssl_verify        = (keycloak_host ~= ""),
              keepalive         = true,
              keepalive_timeout = 60000,
              keepalive_pool    = 4,
          })

          if not res then
              kong.log.err("Keycloak introspection network error: ", err)
              kong.ctx.shared.deny_reason = "keycloak_unreachable"
              return json_exit(503, "Authentication service unavailable")
          end

          if res.status ~= 200 then
              kong.log.err("Keycloak introspection HTTP ", res.status)
              kong.ctx.shared.deny_reason = "keycloak_error"
              return json_exit(503, "Authentication service error")
          end

          local intro, parse_err = cjson.decode(res.body)
          if not intro then
              kong.log.err("Cannot parse Keycloak response: ", parse_err)
              kong.ctx.shared.deny_reason = "keycloak_bad_response"
              return json_exit(503, "Invalid authentication response")
          end

          kong.ctx.shared.token_active = intro.active == true

          if not intro.active then
              kong.ctx.shared.deny_reason = "token_inactive"
              return json_exit(401, "Token is inactive or expired")
          end

          local user_role    = nil
          local max_priority = 0
          local realm_roles  = (intro.realm_access or {}).roles or {}

          for _, r in ipairs(realm_roles) do
              local p = ROLE_PRIORITY[r]
              if p and p > max_priority then
                  user_role    = r
                  max_priority = p
              end
          end

          if not user_role then
              kong.log.warn("No valid role for user: ", intro.preferred_username)
              kong.ctx.shared.deny_reason = "no_valid_role"
              return json_exit(403, "Access denied: no valid role assigned")
          end

          local opa_payload = cjson.encode({
              input = {
                  role     = user_role,
                  username = intro.preferred_username or "unknown",
                  path     = kong.request.get_path(),
                  method   = kong.request.get_method(),
              }
          })

          local opa_res, opa_err = httpc:request_uri(OPA_URL, {
              method  = "POST",
              headers = { ["Content-Type"] = "application/json" },
              body    = opa_payload,
          })

          if not opa_res then
              kong.log.err("OPA request failed: ", opa_err)
              kong.ctx.shared.deny_reason = "opa_unreachable"
              return json_exit(503, "Policy service unavailable")
          end

          local opa_data, opa_parse_err = cjson.decode(opa_res.body)
          if not opa_data then
              kong.log.err("Cannot parse OPA response: ", opa_parse_err)
              kong.ctx.shared.deny_reason = "opa_bad_response"
              return json_exit(503, "Invalid policy response")
          end

          local policy = opa_data.result or {}

          if not policy.allow then
              kong.log.info("OPA denied: user=", intro.preferred_username, " role=", user_role)
              kong.ctx.shared.deny_reason = "opa_denied"
              return json_exit(403, "Access denied by security policy")
          end

          kong.ctx.shared.opa_allowed   = true
          kong.ctx.shared.masked_fields = policy.masked_fields or {}
          kong.ctx.shared.user_role     = user_role
          kong.ctx.shared.username      = intro.preferred_username or "unknown"

          kong.log.info(
              "Access granted: user=", intro.preferred_username,
              " role=", user_role,
              " fields_to_mask=", tostring(#(policy.masked_fields or {}))
          )

          -- ── Unmask path: require X-Unmask-Reason header, then rewrite upstream path ──
          local req_path = kong.request.get_path()
          if req_path:match("^/api/unmask/") then
              local reason = kong.request.get_header("X-Unmask-Reason")
              if not reason or reason == "" then
                  kong.ctx.shared.deny_reason = "missing_unmask_reason"
                  return json_exit(400, "X-Unmask-Reason header is required for data unmasking")
              end
              kong.ctx.shared.unmask_reason = reason
              local cid = req_path:match("^/api/unmask/(.+)$")
              kong.service.request.set_path("/api/customer/" .. (cid or ""))
              kong.log.warn(
                  "Unmask requested: user=", intro.preferred_username,
                  " customer=", cid, " reason=", reason
              )
          end

  # ── Step 2: Response masking ───────────────────────────────────────────────
  - name: post-function
    service: crm-service
    config:
      # Drop Content-Length so body size change doesn't corrupt the response
      header_filter:
        - |
          local fields = kong.ctx.shared.masked_fields
          if fields and #fields > 0 then
            kong.response.clear_header("Content-Length")
          end
      body_filter:
        - |
          local cjson = require("cjson")
          local masked_fields = kong.ctx.shared.masked_fields
          if not masked_fields or #masked_fields == 0 then return end

          local function mask_email(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local user, domain = v:match("^([^@]+)@(.+)$")
            if not user then return "***" end
            if #user <= 2 then return string.rep("*", #user) .. "@" .. domain end
            return user:sub(1,1) .. string.rep("*", #user-2) .. user:sub(-1) .. "@" .. domain
          end

          local function mask_msisdn(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local prefix, digits = v:match("^(%+%d%d?)(%d+)$")
            if prefix and digits then
              if #digits <= 2 then return prefix .. string.rep("*", #digits) end
              return prefix .. string.rep("*", #digits-2) .. digits:sub(-2)
            end
            if #v <= 4 then return string.rep("*", #v) end
            return v:sub(1,3) .. string.rep("*", #v-5) .. v:sub(-2)
          end

          local function mask_name(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local parts = {}
            for word in v:gmatch("%S+") do
              if #word <= 1 then table.insert(parts, word)
              else table.insert(parts, word:sub(1,1) .. string.rep("*", #word-1)) end
            end
            return table.concat(parts, " ")
          end

          local MASKERS = { email=mask_email, msisdn=mask_msisdn, name=mask_name }

          local chunk = ngx.arg[1]
          local eof   = ngx.arg[2]
          kong.ctx.shared.resp_buf = (kong.ctx.shared.resp_buf or "") .. (chunk or "")
          ngx.arg[1] = ""
          if not eof then return end

          local body = kong.ctx.shared.resp_buf
          local data, err = cjson.decode(body)
          if not data or err then ngx.arg[1] = body; return end

          local to_mask = {}
          for _, f in ipairs(masked_fields) do to_mask[f] = true end

          for field, fn in pairs(MASKERS) do
            if to_mask[field] and data[field] ~= nil then
              data[field] = fn(tostring(data[field]))
            end
          end

          data["_masking"] = {
            applied=true, role=kong.ctx.shared.user_role or "unknown",
            masked_fields=masked_fields, gateway="kong-opa",
          }

          local out, enc_err = cjson.encode(data)
          if not out then kong.log.err("re-encode error: ", enc_err); ngx.arg[1]=body; return end
          ngx.arg[1] = out

      # ── Step 3: Audit log (fires after response is sent – no latency impact) ──
      log:
        - |
          local http  = require("resty.http")
          local cjson = require("cjson.safe")
          local LOG_URL = os.getenv("LOG_DASHBOARD_URL") or "http://log-dashboard:9000/log"

          local status      = kong.response.get_status()
          local username    = kong.ctx.shared.username      or "anonymous"
          local user_role   = kong.ctx.shared.user_role     or "unknown"
          local masked      = kong.ctx.shared.masked_fields or {}
          local token_ok    = kong.ctx.shared.token_active
          local opa_allowed = kong.ctx.shared.opa_allowed
          local deny_reason = kong.ctx.shared.deny_reason
          local path          = kong.request.get_path()
          local method        = kong.request.get_method()
          local customer_id   = path:match("/api/customer/([^/?]+)")
                             or path:match("/api/unmask/([^/?]+)") or ""
          local unmask_reason = kong.ctx.shared.unmask_reason
          local event_type    = unmask_reason and "unmask_request" or "api_request"

          local opa_decision
          if opa_allowed ~= nil then
            opa_decision = opa_allowed and "ALLOW" or "DENY"
          elseif status == 403 then opa_decision = "DENY"
          elseif status < 400 or status == 404 then opa_decision = "ALLOW"
          end

          local level
          if    status >= 500 then level = "error"
          elseif status >= 400 then level = "warn"
          else                      level = "info" end

          local entry = cjson.encode({
            service="kong", level=level, event=event_type,
            method=method, path=path, customer_id=customer_id,
            http_status=status, user=username, role=user_role,
            token_active=token_ok, opa_decision=opa_decision,
            masked_fields=masked, masked_count=#masked, deny_reason=deny_reason,
            unmask_reason=unmask_reason,
          })

          local ok, httpc = pcall(http.new)
          if ok then
            httpc:set_timeout(500)
            pcall(function()
              httpc:request_uri(LOG_URL, {
                method="POST", headers={["Content-Type"]="application/json"}, body=entry,
              })
            end)
          end
