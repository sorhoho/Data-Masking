_format_version: "3.0"
_transform: true

# ── Upstream services ─────────────────────────────────────────────────────────
services:
  - name: crm-service
    url: http://crm-mock:5000
    connect_timeout: 10000
    read_timeout: 10000
    write_timeout: 10000
    tags: ["backend:crm"]
    routes:
      - name: crm-customer-route
        paths:
          - /api/customer
        methods:
          - GET
        strip_path: false
      - name: crm-unmask-route
        paths:
          - /api/unmask
        methods:
          - GET
        strip_path: false
      - name: crm-subscription-route
        paths:
          - /api/subscription
        methods:
          - POST
        strip_path: false

  - name: billing-service
    url: http://billing-mock:5001
    connect_timeout: 10000
    read_timeout: 10000
    write_timeout: 10000
    tags: ["backend:billing"]
    routes:
      - name: billing-subscriber-route
        paths:
          - /api/billing
        methods:
          - GET
        strip_path: false

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Unmask-Reason
        - X-Access-Reference
      exposed_headers:
        - Content-Type
      credentials: true
      max_age: 3600

  # ── Step 1: JWT decode + OPA policy check + backend detection ────────────
  - name: pre-function
    config:
      access:
        - |
          local http  = require("resty.http")
          local cjson = require("cjson.safe")

          local OPA_URL          = os.getenv("OPA_URL")          or "http://opa:8181/v1/data/data_masking"
          local LOG_URL          = os.getenv("LOG_DASHBOARD_URL") or "http://log-dashboard:9000/log"
          local CRM_INTERNAL_URL = os.getenv("CRM_INTERNAL_URL") or "http://crm-mock:5000"
          local ROLE_PRIORITY    = { admin = 4, supervisor = 3, vip_agent = 2, agent = 1, partner = 1 }

          kong.ctx.shared.opa_allowed = false
          kong.ctx.shared.deny_reason = nil

          local function json_exit(status, msg)
              return kong.response.exit(status, { error = true, message = msg },
                  { ["Content-Type"] = "application/json" })
          end

          -- ── 1. Extract Bearer token ───────────────────────────────────────
          local auth_header = kong.request.get_header("Authorization")
          if not auth_header then
              kong.ctx.shared.deny_reason = "missing_token"
              return json_exit(401, "Missing Authorization header")
          end

          local token = auth_header:match("^[Bb]earer%s+(.+)$")
          if not token then
              kong.ctx.shared.deny_reason = "malformed_header"
              return json_exit(401, "Invalid Authorization header format")
          end

          -- ── 2. Decode JWT payload (base64url, middle segment) ─────────────
          local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
          if not payload_b64 then
              kong.ctx.shared.deny_reason = "malformed_jwt"
              return json_exit(401, "Malformed JWT")
          end

          local function b64url_decode(s)
              local padded = s:gsub("%-", "+"):gsub("_", "/")
              local pad = #padded % 4
              if pad == 2 then padded = padded .. "=="
              elseif pad == 3 then padded = padded .. "=" end
              return ngx.decode_base64(padded)
          end

          local decoded = b64url_decode(payload_b64)
          if not decoded then
              kong.ctx.shared.deny_reason = "jwt_decode_error"
              return json_exit(401, "Cannot decode JWT payload")
          end

          local claims, parse_err = cjson.decode(decoded)
          if not claims then
              kong.log.err("Cannot parse JWT claims: ", parse_err)
              kong.ctx.shared.deny_reason = "jwt_parse_error"
              return json_exit(401, "Cannot parse JWT claims")
          end

          -- ── 3. Pick highest-priority role from realm_access.roles ─────────
          local realm_roles  = (claims.realm_access or {}).roles or {}
          local user_role    = nil
          local max_priority = 0

          for _, r in ipairs(realm_roles) do
              local p = ROLE_PRIORITY[r]
              if p and p > max_priority then
                  user_role    = r
                  max_priority = p
              end
          end

          if not user_role then
              kong.log.warn("No valid role in JWT for: ", claims.preferred_username)
              kong.ctx.shared.deny_reason = "no_valid_role"
              return json_exit(403, "Access denied: no valid role assigned")
          end

          -- ── 4. Identify backend + resolve customer_id ─────────────────────
          -- Backend is derived from path prefix; customer_id sourced differently
          -- per route type. OPA receives backend so it can return the right
          -- field alias registry for post-function masking.
          local req_path    = kong.request.get_path()
          local customer_id = req_path:match("^/api/customer/([^/?]+)")
                           or req_path:match("^/api/unmask/([^/?]+)")
                           or ""
          local req_msisdn  = nil

          -- Derive backend tag from path prefix
          local backend = "crm"
          if req_path:match("^/api/billing") then backend = "billing" end
          kong.ctx.shared.backend = backend

          -- Helper: resolve MSISDN → CRM customer_id (for OPA VIP check)
          local function resolve_msisdn(msisdn)
              local h = http.new(); h:set_timeout(3000)
              local r, _ = h:request_uri(
                  CRM_INTERNAL_URL .. "/api/resolve?msisdn=" .. ngx.escape_uri(msisdn),
                  { method = "GET" }
              )
              if r and r.status == 200 then
                  local d = cjson.decode(r.body)
                  if d and d.customer_id then return d.customer_id end
              end
              return nil
          end

          -- MSISDN-based CRM search: GET /api/customer?msisdn=...
          if customer_id == "" and req_path == "/api/customer" then
              local msisdn = kong.request.get_query_arg("msisdn")
              if msisdn and msisdn ~= "" then
                  req_msisdn  = msisdn
                  local cid   = resolve_msisdn(msisdn)
                  if not cid then
                      kong.ctx.shared.deny_reason = "customer_not_found"
                      return json_exit(404, "Customer not found for the given MSISDN")
                  end
                  customer_id = cid
              end
          end

          -- Billing subscriber: MSISDN in query param
          if customer_id == "" and req_path:match("^/api/billing/subscriber") then
              local msisdn = kong.request.get_query_arg("msisdn")
              if msisdn and msisdn ~= "" then
                  req_msisdn = msisdn
                  -- Resolve to CRM customer_id for VIP check (best-effort)
                  local cid = resolve_msisdn(msisdn)
                  if cid then customer_id = cid end
                  -- No CRM record → customer_id stays "", OPA treats as non-VIP
              end
          end

          -- Subscription POST: resolve MSISDN from request body
          if req_path:match("^/api/subscription") then
              ngx.req.read_body()
              local raw = ngx.req.get_body_data()
              if raw and raw ~= "" then
                  local body_data, _ = cjson.decode(raw)
                  if body_data and body_data.msisdn then
                      req_msisdn  = body_data.msisdn
                      local cid   = resolve_msisdn(body_data.msisdn)
                      if not cid then
                          kong.ctx.shared.deny_reason = "customer_not_found"
                          return json_exit(404, "Customer not found for the given MSISDN")
                      end
                      customer_id = cid
                  end
              end
              if customer_id == "" then
                  kong.ctx.shared.deny_reason = "missing_msisdn"
                  return json_exit(400, "msisdn is required in the request body")
              end
          end

          -- ── 5. OPA policy check ───────────────────────────────────────────
          local httpc = http.new()
          httpc:set_timeout(5000)

          local opa_res, opa_err = httpc:request_uri(OPA_URL, {
              method  = "POST",
              headers = { ["Content-Type"] = "application/json" },
              body    = cjson.encode({
                  input = {
                      role        = user_role,
                      username    = claims.preferred_username or "unknown",
                      path        = req_path,
                      method      = kong.request.get_method(),
                      customer_id = customer_id,
                      backend     = backend,
                  }
              }),
          })

          if not opa_res then
              kong.log.err("OPA request failed: ", opa_err)
              kong.ctx.shared.deny_reason = "opa_unreachable"
              return json_exit(503, "Policy service unavailable")
          end

          local opa_data, opa_parse_err = cjson.decode(opa_res.body)
          if not opa_data then
              kong.log.err("Cannot parse OPA response: ", opa_parse_err)
              kong.ctx.shared.deny_reason = "opa_bad_response"
              return json_exit(503, "Invalid policy response")
          end

          local policy = opa_data.result or {}

          if not policy.allow then
              kong.log.info("OPA denied: user=", claims.preferred_username,
                            " role=", user_role, " customer=", customer_id)
              kong.ctx.shared.deny_reason = "opa_denied"
              if policy.is_vip then
                  return json_exit(403, "Access denied: VIP customer requires vip_agent or admin role")
              end
              return json_exit(403, "Access denied by security policy")
          end

          kong.ctx.shared.opa_allowed    = true
          kong.ctx.shared.masked_fields  = policy.masked_fields  or {}
          kong.ctx.shared.backend_fields = policy.backend_fields or {}
          kong.ctx.shared.user_role      = user_role
          kong.ctx.shared.username       = claims.preferred_username or "unknown"
          kong.ctx.shared.is_vip         = policy.is_vip == true
          kong.ctx.shared.customer_id    = customer_id
          kong.ctx.shared.req_msisdn     = req_msisdn

          kong.log.info(
              "Access granted: user=", claims.preferred_username,
              " role=", user_role, " backend=", backend,
              " customer=", customer_id,
              " is_vip=", tostring(policy.is_vip == true),
              " fields_to_mask=", tostring(#(policy.masked_fields or {}))
          )

          -- ── 6. VIP: mandatory X-Access-Reference + real-time alert ────────
          if policy.is_vip then
              local access_ref = kong.request.get_header("X-Access-Reference")
              if not access_ref or access_ref == "" then
                  kong.ctx.shared.deny_reason = "missing_access_reference"
                  return json_exit(400,
                      "X-Access-Reference header is required for VIP customer access")
              end
              kong.ctx.shared.access_reference = access_ref

              local al_ok, al_httpc = pcall(http.new)
              if al_ok then
                  al_httpc:set_timeout(500)
                  pcall(function()
                      al_httpc:request_uri(LOG_URL, {
                          method  = "POST",
                          headers = { ["Content-Type"] = "application/json" },
                          body    = cjson.encode({
                              service          = "kong",
                              level            = "warn",
                              event            = "vip_access_alert",
                              customer_id      = customer_id,
                              user             = claims.preferred_username,
                              role             = user_role,
                              access_reference = access_ref,
                              path             = req_path,
                              backend          = backend,
                          }),
                      })
                  end)
              end

              kong.log.warn("VIP access: user=", claims.preferred_username,
                            " customer=", customer_id, " ref=", access_ref)
          end

          -- ── 7. Unmask path: X-Unmask-Reason required, rewrite upstream ────
          if req_path:match("^/api/unmask/") then
              local reason = kong.request.get_header("X-Unmask-Reason")
              if not reason or reason == "" then
                  kong.ctx.shared.deny_reason = "missing_unmask_reason"
                  return json_exit(400,
                      "X-Unmask-Reason header is required for data unmasking")
              end
              kong.ctx.shared.unmask_reason = reason
              local cid = req_path:match("^/api/unmask/(.+)$")
              kong.service.request.set_path("/api/customer/" .. (cid or ""))
              kong.log.warn("Unmask: user=", claims.preferred_username,
                            " customer=", cid, " reason=", reason)
          end

  # ── Step 2: Response masking ───────────────────────────────────────────────
  - name: post-function
    config:
      header_filter:
        - |
          local fields = kong.ctx.shared.masked_fields
          if fields and #fields > 0 then
            kong.response.clear_header("Content-Length")
          end
      body_filter:
        - |
          local cjson = require("cjson")
          local masked_fields = kong.ctx.shared.masked_fields
          if not masked_fields or #masked_fields == 0 then return end

          local function mask_email(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local user, domain = v:match("^([^@]+)@(.+)$")
            if not user then return "***" end
            if #user <= 2 then return string.rep("*", #user) .. "@" .. domain end
            return user:sub(1,1) .. string.rep("*", #user-2) .. user:sub(-1) .. "@" .. domain
          end

          local function mask_msisdn(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local prefix, digits = v:match("^(%+%d%d?)(%d+)$")
            if prefix and digits then
              if #digits <= 2 then return prefix .. string.rep("*", #digits) end
              return prefix .. string.rep("*", #digits-2) .. digits:sub(-2)
            end
            if #v <= 4 then return string.rep("*", #v) end
            return v:sub(1,3) .. string.rep("*", #v-5) .. v:sub(-2)
          end

          local function mask_name(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            local parts = {}
            for word in v:gmatch("%S+") do
              if #word <= 1 then table.insert(parts, word)
              else table.insert(parts, word:sub(1,1) .. string.rep("*", #word-1)) end
            end
            return table.concat(parts, " ")
          end

          local function mask_national_id(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            if #v <= 2 then return string.rep("*", #v) end
            return v:sub(1,2) .. string.rep("*", #v-2)
          end

          local function mask_address(v)
            if type(v) ~= "string" or #v == 0 then return "***" end
            return "*** (redacted)"
          end

          local function mask_redact(v) return "***" end

          -- Maskers keyed by CANONICAL field name
          local MASKERS = {
            email              = mask_email,
            msisdn             = mask_msisdn,
            name               = mask_name,
            national_id        = mask_national_id,
            address            = mask_address,
            last_call_duration = mask_redact,
            data_roaming_gb    = mask_redact,
            last_location      = mask_redact,
          }

          local chunk = ngx.arg[1]
          local eof   = ngx.arg[2]
          kong.ctx.shared.resp_buf = (kong.ctx.shared.resp_buf or "") .. (chunk or "")
          ngx.arg[1] = ""
          if not eof then return end

          local body = kong.ctx.shared.resp_buf
          local data, err = cjson.decode(body)
          if not data or err then ngx.arg[1] = body; return end

          -- Build set of canonical field names that need masking
          local to_mask = {}
          for _, f in ipairs(masked_fields) do to_mask[f] = true end

          -- Pass 1: mask canonical fields (CRM and any backend using canonical names)
          for field, fn in pairs(MASKERS) do
            if to_mask[field] and data[field] ~= nil then
              data[field] = fn(tostring(data[field]))
            end
          end

          -- Pass 2: mask backend-specific aliases
          -- backend_fields = { backend_field: {canonical, classification}, ... }
          -- Only process aliases (backend_field != canonical) to avoid double-masking
          local backend_fields = kong.ctx.shared.backend_fields or {}
          for bfield, bmap in pairs(backend_fields) do
            local canon = type(bmap) == "table" and bmap["canonical"] or nil
            if canon and canon ~= bfield and to_mask[canon] and data[bfield] ~= nil then
              local fn = MASKERS[canon]
              if fn then
                data[bfield] = fn(tostring(data[bfield]))
              end
            end
          end

          data["_masking"] = {
            applied       = true,
            role          = kong.ctx.shared.user_role or "unknown",
            masked_fields = masked_fields,
            gateway       = "kong-opa",
            is_vip        = kong.ctx.shared.is_vip or false,
            backend       = kong.ctx.shared.backend or "unknown",
          }

          local out, enc_err = cjson.encode(data)
          if not out then kong.log.err("re-encode error: ", enc_err); ngx.arg[1]=body; return end
          ngx.arg[1] = out

      # ── Step 3: Audit log ─────────────────────────────────────────────────
      log:
        - |
          local http  = require("resty.http")
          local cjson = require("cjson.safe")
          local LOG_URL = os.getenv("LOG_DASHBOARD_URL") or "http://log-dashboard:9000/log"

          local status           = kong.response.get_status()
          local username         = kong.ctx.shared.username      or "anonymous"
          local user_role        = kong.ctx.shared.user_role     or "unknown"
          local masked           = kong.ctx.shared.masked_fields or {}
          local opa_allowed      = kong.ctx.shared.opa_allowed
          local deny_reason      = kong.ctx.shared.deny_reason
          local path             = kong.request.get_path()
          local method           = kong.request.get_method()
          local customer_id      = kong.ctx.shared.customer_id
                                or path:match("/api/customer/([^/?]+)")
                                or path:match("/api/unmask/([^/?]+)") or ""
          local unmask_reason    = kong.ctx.shared.unmask_reason
          local is_vip           = kong.ctx.shared.is_vip or false
          local access_reference = kong.ctx.shared.access_reference
          local req_msisdn       = kong.ctx.shared.req_msisdn
          local backend          = kong.ctx.shared.backend or "unknown"
          local event_type
          if path:match("^/api/subscription") then
            event_type = "subscription_request"
          elseif unmask_reason then
            event_type = "unmask_request"
          else
            event_type = "api_request"
          end

          local opa_decision
          if opa_allowed ~= nil then
            opa_decision = opa_allowed and "ALLOW" or "DENY"
          elseif status == 403 then opa_decision = "DENY"
          elseif status < 400 or status == 404 then opa_decision = "ALLOW"
          end

          local level
          if    status >= 500 then level = "error"
          elseif status >= 400 then level = "warn"
          else                      level = "info" end

          local ok, httpc = pcall(http.new)
          if ok then
            httpc:set_timeout(500)
            pcall(function()
              httpc:request_uri(LOG_URL, {
                method  = "POST",
                headers = { ["Content-Type"] = "application/json" },
                body    = cjson.encode({
                  service          = "kong",
                  level            = level,
                  event            = event_type,
                  method           = method,
                  path             = path,
                  backend          = backend,
                  customer_id      = customer_id,
                  http_status      = status,
                  user             = username,
                  role             = user_role,
                  opa_decision     = opa_decision,
                  masked_fields    = masked,
                  masked_count     = #masked,
                  deny_reason      = deny_reason,
                  unmask_reason    = unmask_reason,
                  is_vip           = is_vip,
                  access_reference = access_reference,
                  req_msisdn_hint  = req_msisdn and (req_msisdn:sub(1,4) .. "****") or nil,
                }),
              })
            end)
          end
