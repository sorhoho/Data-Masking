<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied – {{ app_cfg.label }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>body { background: #f8f9fa; }</style>
</head>
<body>
<div class="container py-5" style="max-width: 560px">
  <div class="card border-danger shadow">
    <div class="card-body text-center py-5">
      <div style="font-size: 3rem">&#128683;</div>
      <h4 class="fw-bold mt-3 mb-1">Access Denied</h4>
      <p class="text-muted mb-4">
        Your role is not permitted to use <strong>{{ app_cfg.label }}</strong>.
      </p>

      <table class="table table-sm table-bordered text-start mb-4">
        <tr>
          <td class="fw-semibold text-muted small w-40">User</td>
          <td><code>{{ username }}</code></td>
        </tr>
        <tr>
          <td class="fw-semibold text-muted small">Your role</td>
          <td><span class="badge bg-secondary">{{ user_role or 'none' }}</span></td>
        </tr>
        <tr>
          <td class="fw-semibold text-muted small">App</td>
          <td><code>{{ app_cfg.client_id }}</code></td>
        </tr>
        <tr>
          <td class="fw-semibold text-muted small">Allowed roles</td>
          <td>
            {% for r in allowed_roles %}
              <span class="badge bg-dark me-1">{{ r }}</span>
            {% endfor %}
          </td>
        </tr>
      </table>

      <a href="/" class="btn btn-outline-secondary me-2">&#8592; Back to Hub</a>
      <a href="/{{ app_key }}/login" class="btn btn-{{ app_cfg.color }}">Try different account</a>
    </div>
  </div>
</div>
</body>
</html>
